<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polonnaruwa Zone – Marks System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="card login-card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-journal-check display-4 text-primary"></i>
        <h4 class="mt-2 mb-0">Polonnaruwa Zone</h4>
        <p class="text-muted mb-0">Term Test Marks System</p>
        <p class="small text-muted">වාර පරීක්ෂණ ලකුණු කළමනාකරණ පද්ධතිය</p>
      </div>
      <div id="alert" class="alert d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required placeholder="admin@zone.edu.lk">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btnLogin">Login</button>
      </form>
      <hr>
      <p class="small text-muted mb-0 text-center">
        After setup: create admin & school users in Supabase Auth.<br>
        39 schools pre-loaded in database.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (!initSupabase()) {
      document.getElementById('alert').className = 'alert alert-warning';
      document.getElementById('alert').textContent = 'Edit js/config.js and paste your Supabase URL + anon key first.';
      document.getElementById('alert').classList.remove('d-none');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const alert = document.getElementById('alert');
      btn.disabled = true;
      btn.textContent = 'Logging in...';
      try {
        await login(document.getElementById('email').value, document.getElementById('password').value);
        const profile = await getProfile();
        if (!profile) throw new Error('Profile not found. Create a row in profiles table for this user.');
        window.location.href = profile.role === 'admin' ? 'admin.html' : 'school.html';
      } catch (err) {
        alert.className = 'alert alert-danger';
        alert.textContent = err.message || 'Login failed';
        alert.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
