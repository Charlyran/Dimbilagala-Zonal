<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Zone Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
    <div class="container-fluid">
      <a class="navbar-brand" href="admin.html"><i class="bi bi-journal-check"></i> Marks System</a>
      <div class="navbar-nav ms-auto">
        <span class="nav-link text-white-50" id="userLabel"></span>
        <a class="nav-link" href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid py-4">
    <h2 class="mb-1"><i class="bi bi-geo-alt"></i> Polonnaruwa Zone – Overall Results</h2>
    <p class="text-muted mb-4" id="termLabel">Loading...</p>

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="stat-card bg-primary"><h6>Total Schools</h6><div class="num" id="sSchools">–</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card bg-info"><h6>Total Students</h6><div class="num" id="sStudents">–</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card bg-success"><h6>With Marks</h6><div class="num" id="sMarked">–</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card bg-warning text-dark"><h6>Progress</h6><div class="num" id="sProgress">–</div></div></div>
    </div>

    <div class="card">
      <div class="card-header"><strong>All Schools – Status & Average</strong></div>
      <div class="table-responsive">
        <table class="table table-hover table-sm mb-0">
          <thead class="table-light">
            <tr>
              <th>#</th><th>School</th><th class="text-center">Students</th>
              <th class="text-center">With Marks</th><th class="text-center">Progress</th>
              <th class="text-center">Avg</th>
            </tr>
          </thead>
          <tbody id="schoolTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSupabase();
    (async () => {
      const profile = await requireAuth('admin');
      if (!profile) return;
      document.getElementById('userLabel').textContent = profile.username || 'admin';

      const { data: term } = await supabase.from('terms').select('*').eq('is_active', true).maybeSingle();
      document.getElementById('termLabel').textContent = (term?.name || 'No active term') + ' | 39 Schools';

      const { data: schools } = await supabase.from('schools').select('id, name, name_short').eq('is_active', true).order('name');
      const { data: students } = await supabase.from('students').select('id, school_id').eq('is_active', true);

      let totalStudents = students?.length || 0;
      let totalMarked = 0;
      const bySchool = {};

      for (const s of (schools || [])) {
        bySchool[s.id] = { school: s, students: 0, marked: 0, avg: null };
      }
      for (const st of (students || [])) {
        if (bySchool[st.school_id]) bySchool[st.school_id].students++;
      }

      // Marked students count (distinct per school)
      if (term) {
        const { data: marks } = await supabase.from('marks').select('student_id, score, is_absent, students(school_id)').eq('term_id', term.id);
        const markedSet = {};
        const scoreSum = {}, scoreCnt = {};
        for (const m of (marks || [])) {
          const sid = m.students?.school_id;
          if (!sid) continue;
          if (!markedSet[sid]) markedSet[sid] = new Set();
          markedSet[sid].add(m.student_id);
          if (!m.is_absent && m.score != null) {
            scoreSum[sid] = (scoreSum[sid] || 0) + Number(m.score);
            scoreCnt[sid] = (scoreCnt[sid] || 0) + 1;
          }
        }
        for (const sid of Object.keys(bySchool)) {
          bySchool[sid].marked = markedSet[sid]?.size || 0;
          totalMarked += bySchool[sid].marked;
          if (scoreCnt[sid]) bySchool[sid].avg = (scoreSum[sid] / scoreCnt[sid]).toFixed(1);
        }
      }

      document.getElementById('sSchools').textContent = schools?.length || 0;
      document.getElementById('sStudents').textContent = totalStudents;
      document.getElementById('sMarked').textContent = totalMarked;
      document.getElementById('sProgress').textContent = totalStudents ? Math.round(totalMarked / totalStudents * 100) + '%' : '0%';

      const rows = Object.values(bySchool).sort((a, b) => a.school.name.localeCompare(b.school.name));
      document.getElementById('schoolTable').innerHTML = rows.map((r, i) => {
        const pct = r.students ? Math.round(r.marked / r.students * 100) : 0;
        const bar = pct >= 80 ? 'bg-success' : pct >= 40 ? 'bg-warning' : 'bg-danger';
        const name = (r.school.name_short || r.school.name).replace(/^PL\//, '');
        return `<tr>
          <td>${i + 1}</td>
          <td><strong>${name}</strong></td>
          <td class="text-center">${r.students}</td>
          <td class="text-center">${r.marked}</td>
          <td class="text-center"><div class="progress" style="min-width:70px"><div class="progress-bar ${bar}" style="width:${pct}%">${pct}%</div></div></td>
          <td class="text-center fw-bold">${r.avg ?? '–'}</td>
        </tr>`;
      }).join('');
    })();
  </script>
</body>
</html>
