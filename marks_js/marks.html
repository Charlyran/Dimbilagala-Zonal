<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marks Entry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary no-print">
    <div class="container-fluid">
      <a class="navbar-brand" href="school.html">← Back</a>
      <button class="btn btn-light btn-sm" id="saveBtn">Save All Marks</button>
    </div>
  </nav>
  <div class="container-fluid py-3">
    <h4 id="title">Marks Entry</h4>
    <p class="text-muted small">Use <code>ab</code> for absent. Leave blank if not entered.</p>
    <div class="table-responsive">
      <table class="table table-bordered table-sm" id="tbl">
        <thead class="table-light" id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSupabase();
    const classId = new URLSearchParams(location.search).get('class_id');
    let termId = null, subjects = [], students = [];

    (async () => {
      const profile = await requireAuth('school');
      if (!profile) return;

      const { data: cls } = await supabase.from('classes').select('*').eq('id', classId).single();
      document.getElementById('title').textContent = `Marks – ${cls.grade_number} - ${cls.section}`;

      const { data: term } = await supabase.from('terms').select('*').eq('is_active', true).maybeSingle();
      termId = term?.id;
      if (!termId) { alert('No active term'); return; }

      const { data: subs } = await supabase.from('subjects').select('*')
        .lte('grade_from', cls.grade_number).gte('grade_to', cls.grade_number).eq('is_active', true).order('code');
      subjects = subs || [];

      const { data: sts } = await supabase.from('students').select('*').eq('class_id', classId).eq('is_active', true).order('name');
      students = sts || [];

      const { data: existing } = await supabase.from('marks').select('*').eq('term_id', termId)
        .in('student_id', students.map(s => s.id));

      const markMap = {};
      for (const m of (existing || [])) markMap[`${m.student_id}_${m.subject_id}`] = m;

      document.getElementById('thead').innerHTML = `<tr>
        <th>#</th><th>Name</th>
        ${subjects.map(s => `<th class="text-center"><small>${s.name_sinhala || s.name}</small></th>`).join('')}
      </tr>`;

      document.getElementById('tbody').innerHTML = students.map((st, i) => `<tr data-sid="${st.id}">
        <td>${i+1}</td><td>${st.name}</td>
        ${subjects.map(sub => {
          const m = markMap[`${st.id}_${sub.id}`];
          let val = '';
          if (m) val = m.is_absent ? 'ab' : (m.score ?? '');
          return `<td class="p-1"><input class="form-control form-control-sm mark-input" data-sub="${sub.id}" value="${val}" placeholder="-"></td>`;
        }).join('')}
      </tr>`).join('') || '<tr><td colspan="20" class="text-muted">No students. Add students first.</td></tr>';

      document.getElementById('saveBtn').onclick = async () => {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.textContent = 'Saving...';
        const rows = [];
        document.querySelectorAll('#tbody tr[data-sid]').forEach(tr => {
          const sid = parseInt(tr.dataset.sid);
          tr.querySelectorAll('input.mark-input').forEach(inp => {
            const subId = parseInt(inp.dataset.sub);
            const v = inp.value.trim().toLowerCase();
            const is_absent = v === 'ab' || v === 'abs';
            let score = null;
            if (!is_absent && v !== '') {
              score = parseFloat(v);
              if (isNaN(score) || score < 0 || score > 100) return;
            }
            if (v === '' && !is_absent) return;
            rows.push({ student_id: sid, subject_id: subId, term_id: termId, score, is_absent, updated_at: new Date().toISOString() });
          });
        });
        if (rows.length) {
          const { error } = await supabase.from('marks').upsert(rows, { onConflict: 'student_id,subject_id,term_id' });
          if (error) alert(error.message);
          else alert('Saved ' + rows.length + ' entries');
        }
        btn.disabled = false; btn.textContent = 'Save All Marks';
      };
    })();
  </script>
</body>
</html>
