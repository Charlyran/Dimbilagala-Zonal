<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
    <div class="container-fluid">
      <a class="navbar-brand" href="school.html"><i class="bi bi-journal-check"></i> Marks System</a>
      <div class="navbar-nav ms-auto">
        <span class="nav-link text-white-50" id="userLabel"></span>
        <a class="nav-link" href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid py-4">
    <h2 id="schoolName">–</h2>
    <p class="text-muted" id="schoolMeta"></p>

    <div class="row g-3 mb-4">
      <div class="col-md-4"><div class="card"><div class="card-body"><h6 class="text-muted">Classes</h6><p class="display-6 mb-0" id="cCount">0</p></div></div></div>
      <div class="col-md-4"><div class="card"><div class="card-body"><h6 class="text-muted">Students</h6><p class="display-6 mb-0" id="sCount">0</p></div></div></div>
      <div class="col-md-4"><div class="card"><div class="card-body"><h6 class="text-muted">Active Term</h6><p class="mb-0" id="termName">–</p></div></div></div>
    </div>

    <div class="row">
      <div class="col-lg-7">
        <div class="card mb-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Your Classes</strong>
          </div>
          <ul class="list-group list-group-flush" id="classList">
            <li class="list-group-item text-muted">Loading...</li>
          </ul>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card">
          <div class="card-header">Add Class</div>
          <div class="card-body">
            <form id="addClassForm">
              <div class="mb-2">
                <label class="form-label">Grade</label>
                <select id="gradeNum" class="form-select" required>
                  <option value="6">Grade 6</option>
                  <option value="7">Grade 7</option>
                  <option value="8">Grade 8</option>
                  <option value="9">Grade 9</option>
                  <option value="10">Grade 10</option>
                  <option value="11">Grade 11</option>
                </select>
              </div>
              <div class="mb-2">
                <label class="form-label">Section (A, B, C...)</label>
                <input type="text" id="section" class="form-control" maxlength="2" required placeholder="A">
              </div>
              <div class="mb-2">
                <label class="form-label">Class Teacher</label>
                <input type="text" id="teacher" class="form-control">
              </div>
              <button class="btn btn-primary w-100">Add Class</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSupabase();
    let schoolId = null;

    async function loadClasses() {
      const { data: classes } = await supabase.from('classes').select('*').eq('school_id', schoolId).order('grade_number').order('section');
      const { count: stCount } = await supabase.from('students').select('*', { count: 'exact', head: true }).eq('school_id', schoolId).eq('is_active', true);
      document.getElementById('cCount').textContent = classes?.length || 0;
      document.getElementById('sCount').textContent = stCount || 0;

      if (!classes?.length) {
        document.getElementById('classList').innerHTML = '<li class="list-group-item text-muted">No classes yet. Add one on the right.</li>';
        return;
      }
      document.getElementById('classList').innerHTML = classes.map(c => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div><strong>${c.grade_number} - ${c.section}</strong>
            ${c.class_teacher ? '<br><small class="text-muted">' + c.class_teacher + '</small>' : ''}
          </div>
          <div>
            <a href="students.html?class_id=${c.id}" class="btn btn-sm btn-outline-secondary">Students</a>
            <a href="marks.html?class_id=${c.id}" class="btn btn-sm btn-outline-primary">Marks</a>
          </div>
        </li>
      `).join('');
    }

    (async () => {
      const profile = await requireAuth('school');
      if (!profile) return;
      schoolId = profile.school_id;
      document.getElementById('userLabel').textContent = profile.username || '';
      document.getElementById('schoolName').textContent = profile.schools?.name || 'School';
      document.getElementById('schoolMeta').textContent = (profile.schools?.name_short || '') + ' – ' + (profile.schools?.division || '');

      const { data: term } = await supabase.from('terms').select('*').eq('is_active', true).maybeSingle();
      document.getElementById('termName').textContent = term?.name || 'None';

      await loadClasses();

      document.getElementById('addClassForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const grade_number = parseInt(document.getElementById('gradeNum').value);
        const section = document.getElementById('section').value.trim().toUpperCase();
        const class_teacher = document.getElementById('teacher').value.trim();
        const { error } = await supabase.from('classes').insert({ school_id: schoolId, grade_number, section, class_teacher });
        if (error) { alert(error.message); return; }
        e.target.reset();
        await loadClasses();
      });
    })();
  </script>
</body>
</html>
