{% extends "base.html" %}
{% block title %}Terms{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-calendar3"></i> Examination Terms</h2>
</div>
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                        <tr><th>Year</th><th>Term</th><th>Name</th><th>Active</th></tr>
                    </thead>
                    <tbody>
                        {% for t in terms %}
                        <tr>
                            <td>{{ t.year }}</td>
                            <td>{{ t.term_number }}</td>
                            <td>{{ t.name }}</td>
                            <td>{% if t.is_active %}<span class="badge bg-success">Yes</span>{% else %}-{% endif %}</td>
                        </tr>
                        {% else %}
                        <tr><td colspan="4" class="text-muted text-center">No terms</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">Add Term</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.add_term') }}">
                    <div class="mb-2">
                        <label class="form-label">Year</label>
                        <input type="number" name="year" class="form-control" value="2026" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Term Number (1/2/3)</label>
                        <input type="number" name="term_number" class="form-control" min="1" max="3" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" placeholder="II වාර පරීක්ෂණය - 2026">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
