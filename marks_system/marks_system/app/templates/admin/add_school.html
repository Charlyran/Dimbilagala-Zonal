{% extends "base.html" %}
{% block title %}Add School{% endblock %}
{% block content %}
<h2 class="mb-4">Add New School</h2>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">School Name (English) *</label>
                    <input type="text" name="name" class="form-control" required placeholder="St. Joseph's College">
                </div>
                <div class="col-md-6">
                    <label class="form-label">School Name (Sinhala)</label>
                    <input type="text" name="name_sinhala" class="form-control sinhala" placeholder="අ/ශාන්ත ජෝශප් විද්‍යාලය">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Division / කොට්ඨාසය</label>
                    <input type="text" name="division" class="form-control" placeholder="Anuradhapura">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Principal Name</label>
                    <input type="text" name="principal_name" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Contact Phone</label>
                    <input type="text" name="contact_phone" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Contact Email</label>
                    <input type="email" name="contact_email" class="form-control">
                </div>
                <div class="col-12"><hr><h5>School Login Account</h5></div>
                <div class="col-md-6">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Create School & Account</button>
                <a href="{{ url_for('admin.schools') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
