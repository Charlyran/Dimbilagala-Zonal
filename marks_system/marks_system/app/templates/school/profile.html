{% extends "base.html" %}
{% block title %}School Profile{% endblock %}
{% block content %}
<h2 class="mb-4">School Profile</h2>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">School Name (English)</label>
                    <input type="text" name="name" class="form-control" value="{{ school.name }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">School Name (Sinhala)</label>
                    <input type="text" name="name_sinhala" class="form-control sinhala" value="{{ school.name_sinhala or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Division / කොට්ඨාසය</label>
                    <input type="text" name="division" class="form-control" value="{{ school.division or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Principal</label>
                    <input type="text" name="principal_name" class="form-control" value="{{ school.principal_name or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" name="contact_phone" class="form-control" value="{{ school.contact_phone or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" name="contact_email" class="form-control" value="{{ school.contact_email or '' }}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
